name: Build and Deploy to Azure Container Apps

image: docker:latest

on:
  push:
    branches:
      - main

variables:
  AZURE_RESOURCE_GROUP: "ChatBot"
  AZURE_CONTAINER_REGISTRY: "chatbotcr001"
  AZURE_REGION: "westeurope"
  ENVIRONMENT: "dev"

  BACKEND_NAME: "container-chatbot-be"
  BACKEND_IMAGE_TAG: "v1.0.0"
  BACKEND_IMAGE: "$AZURE_CONTAINER_REGISTRY.azurecr.io/$BACKEND_NAME:$BACKEND_IMAGE_TAG"

  # FRONTEND_NAME: "container-chatbot-fe"
  # FRONTEND_IMAGE_TAG: "v1.0.0"
  # FRONTEND_IMAGE: "$AZURE_CONTAINER_REGISTRY.azurecr.io/$FRONTEND_NAME:$FRONTEND_IMAGE_TAG"

stages:
  - build
  - push
  - deploy

before_script:
  - apk add --no-cache bash curl jq
  - echo "Logging into Azure Container Registry..."
  - echo "${{ secrets.ACR_PASSWORD }}" | docker login "$AZURE_CONTAINER_REGISTRY.azurecr.io" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

build_backend:
  stage: build
  script:
    - echo "Building Backend Docker image..."
    - docker build -t $BACKEND_IMAGE
  only:
    - main

# build_frontend:
#   stage: build
#   script:
#     - echo "Building Frontend Docker image..."
#     - docker build -t $FRONTEND_IMAGE ./frontend
#   only:
#     - main

push_backend:
  stage: push
  script:
    - echo "Pushing Backend Docker image to ACR..."
    - docker push $BACKEND_IMAGE
  only:
    - main

# push_frontend:
#   stage: push
#   script:
#     - echo "Pushing Frontend Docker image to ACR..."
#     - docker push $FRONTEND_IMAGE
#   only:
#     - main

deploy_backend:
  stage: deploy
  script:
    - echo "Creating Azure Container Apps environment..."
    - az containerapp env create \
        --name $ENVIRONMENT \
        --resource-group $AZURE_RESOURCE_GROUP \
        --location $AZURE_REGION || true

    - echo "Deploying Backend to Azure Container Apps..."
    - az containerapp create \
        --name $BACKEND_NAME \
        --resource-group $AZURE_RESOURCE_GROUP \
        --environment $ENVIRONMENT \
        --image $BACKEND_IMAGE \
        --target-port 4000 \
        --ingress internal \
        --registry-server $AZURE_CONTAINER_REGISTRY.azurecr.io \
        --query properties.configuration.ingress.fqdn
  only:
    - main

# deploy_frontend:
