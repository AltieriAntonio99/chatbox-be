#         --registry-server $AZURE_CONTAINER_REGISTRY.azurecr.io \
#         --query properties.configuration.ingress.fqdn
#   only:
#     - main

autoscale_backend:
  stage: deploy
  script:
    - echo "Configuring auto-scaling for Backend..."
    - az containerapp revision-stable-set \
        --name $BACKEND_NAME \
        --resource-group $AZURE_RESOURCE_GROUP \
        --min-replicas 1 \
        --max-replicas 5 \
        --scale-rule-type http \
        --scale-rule-name backend-scaling \
        --concurrent-requests 50
  only:
    - main

