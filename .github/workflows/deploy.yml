name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Login to Azure Container Registry
      run: |
        echo "${{ secrets.ACR_PASSWORD }}" | docker login chatbotcr001.azurecr.io -u "${{ secrets.ACR_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t chatbotcr001.azurecr.io/chatbot-be:v1.0.2 .
        docker push chatbotcr001.azurecr.io/chatbot-be:v1.0.2

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update --name chatbotcapp001 --resource-group ChatBot --image chatbotcr001.azurecr.io/chatbot-be:v1.0.2 --ingress external
