name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  AZURE_RESOURCE_GROUP: "ChatBot"
  AZURE_CONTAINER_REGISTRY: "chatbotcr001"
  AZURE_REGION: "westeurope"
  ENVIRONMENT: "dev"
  BACKEND_NAME: "container-chatbot-be"
  BACKEND_IMAGE: "chatbotcr001.azurecr.io/container-chatbot-be:v1.0.0"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Login to Azure Container Registry
      run: |
        echo "${{ secrets.ACR_PASSWORD }}" | docker login chatbotcr001.azurecr.io -u "${{ secrets.ACR_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t $BACKEND_IMAGE .
        docker push $BACKEND_IMAGE

